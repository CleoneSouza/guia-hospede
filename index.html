/* Layout: app de celular em coluna única; capa com foto, grade de 15 atalhos, seções em cartões. */
:root{
  --bg:#f3eee6; --surface:#ffffff; --ink:#1a1814; --muted:#6a6358; --gold:#8a6d1f; --line:#e2d9ca;
  --tile:#1a1814; --tile-ink:#f3eee6; --warn:#9a3b2e; --ok:#2f6b46;
  --display:"Antonio","Oswald","Arial Narrow",Impact,sans-serif;
  --script:"Great Vibes","Brush Script MT",cursive;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1f1c17; --ink:#f1ebdf; --muted:#b0a794; --gold:#d6b25a; --line:#332e26;
    --tile:#f1ebdf; --tile-ink:#1a1814; --warn:#e58a7b; --ok:#7fc79b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1f1c17; --ink:#f1ebdf; --muted:#b0a794; --gold:#d6b25a; --line:#332e26;
  --tile:#f1ebdf; --tile-ink:#1a1814; --warn:#e58a7b; --ok:#7fc79b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
a{color:var(--gold);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;margin:0;text-wrap:balance}
.script{font-family:var(--script);font-weight:400;text-transform:none;letter-spacing:0}

/* barra superior */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--tile);color:var(--tile-ink);font:600 13px var(--body);padding:8px 14px 8px 10px;border-radius:99px;cursor:pointer}
.bar .brand{font:600 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lang{display:flex;gap:4px;margin-left:auto}
.bar .lang button{padding:6px;background:transparent;border:2px solid transparent;border-radius:10px;opacity:.6;display:grid;place-items:center}
.bar .lang button[aria-pressed="true"]{border-color:var(--ink);opacity:1}
.flag{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2);display:block}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
.bar{padding-top:max(0px,env(safe-area-inset-top))}
.install{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:50;background:var(--tile);color:var(--tile-ink);border-radius:16px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:520px;margin:0 auto}
.install b{display:block;font:600 15px var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:#d6b25a}
.install p{margin:0 0 6px;font-size:13px;line-height:1.4}
.install .row{display:flex;gap:8px;margin-top:8px}
.install button{font:700 13px var(--body);padding:8px 14px;border-radius:99px;border:1.5px solid var(--tile-ink);background:transparent;color:var(--tile-ink);cursor:pointer}
.install button.go{background:#d6b25a;border-color:#d6b25a;color:#1a1814}
.picker{padding:18px 16px 0;text-align:center}
.picker p{margin:0 0 10px;font:600 13px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.picker div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.picker button{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--body);padding:8px 11px;border-radius:99px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink)}
.hero a{color:inherit}
.homect{margin:0 16px 24px;text-align:center}
.homect h2{font-size:20px;margin-bottom:4px}
.homect .num{font-weight:700;margin:2px 0 0}
.homect .btns{justify-content:center}
.btn.sm,.mini{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font:700 12px var(--body);text-decoration:none;cursor:pointer;background:var(--tile);color:var(--tile-ink);border:1.5px solid var(--tile)}
.mini.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.ct .row{flex-wrap:wrap;gap:8px 10px}
.ct .info{flex:1 1 160px;min-width:0}
.ct .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:430px){.bar.sec .brand{display:none}}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* capa */
.hero{position:relative;color:#fff}
.hero img{width:100%;height:min(62vh,520px);object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,5,.82),rgba(10,8,5,.05) 62%)}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 22px;z-index:1}
.hero .script{font-size:54px;line-height:1;margin-bottom:4px}
.hero h1{font-size:30px}
.hero p{margin:10px 0 0;font:600 12px/1.45 var(--body);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:flex-start;opacity:.95}
.menu-head{text-align:center;padding:26px 20px 8px}
.menu-head .script{font-size:44px;line-height:1.1}
.menu-head p{margin:4px 0 0;font:600 13px var(--display);letter-spacing:.2em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;padding:18px 20px 40px}
.tile{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);text-align:center;font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase}
.tile span.ic{width:68px;height:68px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s}
.tile:hover span.ic,.tile:focus-visible span.ic{transform:translateY(-2px);background:var(--tile);color:var(--tile-ink)}
.tile svg.i{width:30px;height:30px;stroke-width:1.5}
@media (prefers-reduced-motion:reduce){.tile span.ic{transition:none}}

/* seção */
.cover{position:relative}
.cover img{width:100%;aspect-ratio:16/10;object-fit:cover}
.cover h1{position:absolute;left:16px;bottom:-22px;right:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:30px}
.content{padding:42px 16px 28px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:22px}
.card h3{font-size:19px}
.sub{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.txt p{margin:8px 0 0}
.upper{text-transform:uppercase;letter-spacing:.03em;font-weight:600;font-size:14px}
.item{display:flex;gap:14px;align-items:flex-start}
.item img{width:84px;height:84px;object-fit:cover;border-radius:14px;flex:none}
.item .body{min-width:0;flex:1}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:15px}
.lines a,.lines span{overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--tile);color:var(--tile-ink);font:700 14px var(--body);padding:12px 18px;border-radius:12px;text-decoration:none;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.script-big{font-size:44px;text-align:center;line-height:1.1}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:11px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink)}
.time{text-align:center}
.time .big{font:600 64px/1 var(--display);color:var(--gold);letter-spacing:.02em}
.time .lbl{font:600 13px var(--display);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.steps{list-style:none;margin:14px 0 0;padding:0 0 0 4px;display:flex;flex-direction:column}
.steps li{position:relative;padding:0 0 14px 28px}
.steps li:before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.steps li:after{content:"";position:absolute;left:9px;top:18px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child{padding-bottom:0}.steps li:last-child:after{display:none}
.note{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.wifi dl{margin:12px 0 0;display:grid;gap:10px}
.wifi dt{font:600 12px var(--display);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.wifi dd{margin:2px 0 0;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:700 17px var(--body);overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 12px var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;flex:none}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules .r{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.rules .n{font:600 28px var(--display);color:var(--gold);display:block;line-height:1;margin-bottom:6px}
.list{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eq .e{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.eq .e b{display:block;font:600 16px var(--display);text-transform:uppercase;letter-spacing:.03em}
.eq .e.no{border-style:dashed;color:var(--muted)}
.eq .e.no b{text-decoration:line-through;text-decoration-thickness:1px}
.nums{display:flex;gap:10px;justify-content:space-between;align-items:center}
.nums .n{flex:1 1 0;min-width:0;text-align:center}
.nums .n b{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 6px;border:2px dashed var(--ink);border-radius:50%;font:600 30px var(--display)}
.nums .n span{font:600 12px var(--display);letter-spacing:.14em}
@media (max-width:360px){.nums{flex-wrap:wrap;justify-content:center}.seal{flex:0 0 100%}}
@media (max-width:420px){.nums{gap:6px}.nums .n b{width:62px;height:62px;font-size:25px}.nums .n span{font-size:11px;letter-spacing:.06em;display:block}.seal{font-size:20px;padding:6px 8px}}
.seal{font:700 26px var(--display);color:var(--warn);text-align:center;border:2px solid var(--warn);border-radius:16px;padding:6px 10px;line-height:1.1}
.chk{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.chk li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.chk svg{color:var(--ok);margin-top:2px}
.drv{display:flex;gap:14px;align-items:center}
.drv img{width:76px;height:76px;border-radius:18px;flex:none}
.drv .tag{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hosts{display:flex;gap:12px;align-items:center}
.hosts img{width:84px;height:84px;border-radius:50%;object-fit:cover}
.ct{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ct .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ct .row:last-child{border:0}.ct .k{font:600 12px var(--display);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ct .v{overflow-wrap:anywhere;font-weight:600}
.cap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.cap p{margin:0;padding:14px 16px;font:600 17px/1.2 var(--display);text-transform:uppercase;text-align:center}
.pager{display:flex;gap:10px;justify-content:space-between;padding:0 16px 40px}
.pager a{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase}
.pager a.next{justify-content:flex-end;text-align:right}.pager a span{min-width:0;overflow-wrap:anywhere}@media (max-width:360px){.pager a{padding:10px;gap:6px;letter-spacing:.04em;font-size:12px}}
.homebtn-wrap{padding:0 16px 40px;margin-top:-24px}
.homebtn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--tile);color:var(--tile-ink);border-radius:99px;padding:14px;font:700 14px var(--body);letter-spacing:.06em;text-transform:uppercase}
.pager small{display:block;font:600 10px var(--body);letter-spacing:.1em;color:var(--muted)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 28px}
</style>

var deferred=null;

function isStandalone(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;}

  try{if(localStorage.getItem("cs7-install-off"))return;}catch(e){}

var last={sec:null,lang:null};
function render(){
  var st=parse(),id=st.sec,idx=-1,y=window.scrollY;
  lang=st.lang;D=loc(RAW);
  try{localStorage.setItem("cs7-lang",lang);}catch(e){}
  document.documentElement.lang=HTML_LANG[lang];
  D.secoes.forEach(function(s,i){if(s.id===id)idx=i;});
  app.innerHTML="";
  var bar=h("div",{class:"bar"+(idx>=0?" sec":"")});
  if(idx>=0){bar.appendChild(h("button",{type:"button",on:{click:function(){location.hash=hashFor(lang,"");}}},icon("back"),T("menu")));}

  });
  bar.appendChild(sw);

  app.appendChild(idx>=0?section(idx):home());
  var mesmaTela=(last.sec===id&&last.lang!==null&&last.lang!==lang);
  window.scrollTo(0,mesmaTela?y:0);
